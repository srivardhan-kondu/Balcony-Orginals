        <title>Balcony Originals — Stories rooted in culture. Told for the world.</title>
        <!-- The pre-boot screen paints before the CSS bundle exists, so its two
             background values are literals here rather than theme tokens. -->
        <style>
            #bo-preboot {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }
            #bo-preboot img {
                width: min(150vw, 720px);
                max-width: none;
            }
            /* Second visit onward the splash is skipped, so stand in for the
               page instead of for the black splash that is no longer coming. */
            html[data-preboot="page"] #bo-preboot {
                background: #050505;
            }
            html[data-preboot="page"] #bo-preboot img {
                display: none;
            }
            html.light[data-preboot="page"] #bo-preboot {
                background: #faf9f6;
            }
            /* Home opens on the projection hero, whose first beat is an empty
               black screen. Standing in with the brand mark here would put a
               logo on that screen before the lamp has struck — so home pre-boots
               to flat black, in either theme, and the first thing that appears
               is the light. */
            html[data-preboot="dark"] #bo-preboot {
                background: #050505;
            }
            html[data-preboot="dark"] #bo-preboot img {
                display: none;
            }
        </style>
        <!-- Theme, applied before first paint. Without this the page paints in
             the default theme and then corrects itself once React mounts. -->
        <script>
            (function () {
                var d = document.documentElement;
                var t = "dark";
                try {
                    var s = localStorage.getItem("bo-theme");
                    if (s === "light" || s === "dark") t = s;
                } catch (e) {}
                d.classList.add(t);
                d.style.colorScheme = t;
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#FAF9F6" : "#0C0B0A");
                if (location.pathname === "/") {
                    d.setAttribute("data-preboot", "dark");
                } else {
                    try {
                        if (sessionStorage.getItem("bo-intro-seen")) d.setAttribute("data-preboot", "page");
                    } catch (e) {}
                }
            })();
        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>

             rendering entirely when the host is slow or unreachable (in-app
             browsers, restrictive networks), leaving a blank page. -->
        <script defer src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
